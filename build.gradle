plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'com.gradleup.shadow' version '9.0.0'
}

group = 'com.bahairesearch'
version = '1.5.0'

ext.javafxVersion = '21.0.6'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

application {
    mainClass = 'com.bahairesearch.BahaiResearchLauncher'
}

javafx {
    version = javafxVersion
    modules = ['javafx.controls', 'javafx.fxml']
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jsoup:jsoup:1.18.3'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    implementation 'org.slf4j:slf4j-simple:2.0.16'
    implementation 'org.xerial:sqlite-jdbc:3.46.1.3'
    implementation 'org.apache.pdfbox:pdfbox:3.0.3'
    implementation 'com.bahairesearch:bahai-search-common:1.1.0'
}

// Linux/Windows release: bundle the other OS's JavaFX natives into the same fat jar so one
// artifact runs on both (JavaFX extracts them from the jar at runtime).
//   ./gradlew shadowJar -PbundleJavaFxPlatforms=win
// Leave unset for normal local builds.
def extraJavaFxPlatforms = (findProperty('bundleJavaFxPlatforms') ?: '')
        .split(',')*.trim().findAll { it }
if (!extraJavaFxPlatforms.isEmpty()) {
    dependencies {
        ['javafx-base', 'javafx-graphics', 'javafx-controls', 'javafx-fxml'].each { module ->
            extraJavaFxPlatforms.each { platform ->
                runtimeOnly "org.openjfx:${module}:${javafxVersion}:${platform}"
            }
        }
    }
}

shadowJar {
    archiveClassifier = 'all'
    manifest {
        attributes 'Main-Class': 'com.bahairesearch.BahaiResearchLauncher'
    }
    mergeServiceFiles()
}
